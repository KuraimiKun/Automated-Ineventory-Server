version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aims-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong!Passw0rd" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aims-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__InventoryDatabase=Server=sqlserver;Database=AutomatedInventory;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      - AdminUser__UserName=admin
      - AdminUser__Email=admin@local
      - AdminUser__Password=Admin123!
      - AdminUser__FullName=Administrator
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver_data:
